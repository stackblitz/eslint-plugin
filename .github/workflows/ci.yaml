name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ESLint ${{ matrix.eslint-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
        eslint-version: [9, 10]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Install ESLint ${{ matrix.eslint-version }}
        run: pnpm add -D eslint@${{ matrix.eslint-version }}

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
